name: Matrices frontier Wave 2 v2 — 30-agent architecture ablation council

on:
  workflow_run:
    workflows: ['Matrices frontier Wave 1 v2 — 30-agent budget council']
    types: [completed]
    branches: [yukon-matrices-fast-20260829]

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-24.04
    outputs:
      frontier_sha: ${{ steps.frontier.outputs.sha }}
    steps:
      - name: Record completed Wave 1 run
        shell: bash
        run: |
          echo "Wave 1 run: ${{ github.event.workflow_run.id }}"
          echo "Wave 1 conclusion: ${{ github.event.workflow_run.conclusion }}"

      - name: Pin promoted frontier after Wave 1
        id: frontier
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/Layr-Labs/ssi-ordering-challenge.git refs/heads/main | awk '{print $1}')"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned Wave 2 frontier: $sha"

      - name: Build exact cargo-deny once
        shell: bash
        run: |
          set -euo pipefail
          rustup default stable
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --version

      - name: Share cargo-deny with all lanes
        uses: actions/upload-artifact@v4
        with:
          name: cargo-deny-wave2-v2-0.20.2-${{ github.run_id }}
          path: /home/runner/.cargo/bin/cargo-deny
          retention-days: 2
          compression-level: 0

  lane:
    needs: pin
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        include:
          - { id: W2-00-control, persona: P24-orchestrator, patch: control }
          - { id: W2-01-no-orbit, persona: P02-chordal, patch: no-orbit }
          - { id: W2-02-no-pharmakos, persona: P07-portfolio-economist, patch: no-pharmakos }
          - { id: W2-03-no-midx, persona: P03-min-degree, patch: no-midx }
          - { id: W2-04-no-rgreedy-all, persona: P06-combinatorial, patch: no-rgreedy-all }
          - { id: W2-05-no-telos-ms, persona: P07-portfolio-economist, patch: no-telos-ms }
          - { id: W2-06-telos-ms-1, persona: P22-frontier-math, patch: telos-ms-1 }
          - { id: W2-07-telos-ms-2, persona: P22-frontier-math, patch: telos-ms-2 }
          - { id: W2-08-telos-ms-4, persona: P22-frontier-math, patch: telos-ms-4 }
          - { id: W2-09-telos-ms-7, persona: P22-frontier-math, patch: telos-ms-7 }
          - { id: W2-10-relabel-cap-0, persona: P12-seed-designer, patch: relabel-cap-0 }
          - { id: W2-11-relabel-cap-2, persona: P12-seed-designer, patch: relabel-cap-2 }
          - { id: W2-12-relabel-cap-4, persona: P12-seed-designer, patch: relabel-cap-4 }
          - { id: W2-13-relabel-cap-8, persona: P12-seed-designer, patch: relabel-cap-8 }
          - { id: W2-14-relabel-cap-12, persona: P12-seed-designer, patch: relabel-cap-12 }
          - { id: W2-15-relabel-cap-16, persona: P12-seed-designer, patch: relabel-cap-16 }
          - { id: W2-16-no-early-minl, persona: P17-completion-scheduler, patch: no-early-minl }
          - { id: W2-17-no-terminal-minl, persona: P17-completion-scheduler, patch: no-terminal-minl }
          - { id: W2-18-no-pair-descent, persona: P16-local-search, patch: no-pair-descent }
          - { id: W2-19-terminal-only-completion, persona: P22-frontier-math, patch: terminal-only-completion }
          - { id: W2-20-no-completion-all, persona: P02-chordal, patch: no-completion-all }
          - { id: W2-21-no-orbit-no-pharmakos, persona: P07-portfolio-economist, patch: no-orbit-no-pharmakos }
          - { id: W2-22-no-midx-no-pharmakos, persona: P07-portfolio-economist, patch: no-midx-no-pharmakos }
          - { id: W2-23-no-main-telos-all, persona: P22-frontier-math, patch: no-main-telos-all }
          - { id: W2-24-no-hillclimb, persona: P07-portfolio-economist, patch: no-hillclimb }
          - { id: W2-25-no-peel-countrel, persona: P07-portfolio-economist, patch: no-peel-countrel }
          - { id: W2-26-no-shot3, persona: P07-portfolio-economist, patch: no-shot3 }
          - { id: W2-27-no-whole-rgreedy-only, persona: P06-combinatorial, patch: no-whole-rgreedy-only }
          - { id: W2-28-no-rgsub-only, persona: P14-etree-analyst, patch: no-rgsub-only }
          - { id: W2-29-no-pair-and-terminal, persona: P16-local-search, patch: no-pair-and-terminal }

    env:
      HYPOTHESIS_ID: ${{ matrix.id }}
      PERSONA: ${{ matrix.persona }}
      PATCH_ID: ${{ matrix.patch }}
      FRONTIER_SHA: ${{ needs.pin.outputs.frontier_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Download exact cargo-deny
        uses: actions/download-artifact@v4
        with:
          name: cargo-deny-wave2-v2-0.20.2-${{ github.run_id }}
          path: ${{ runner.temp }}/cargo-deny

      - name: Install shared cargo-deny binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin"
          cp "${RUNNER_TEMP}/cargo-deny/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          chmod 755 "$HOME/.cargo/bin/cargo-deny"
          "$HOME/.cargo/bin/cargo-deny" --version

      - name: Enable Bubblewrap user namespaces
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Execute one architecture ablation
        shell: bash
        run: bash matrices-frontier/run-wave2-lane-v2.sh

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrices-wave2-v2-${{ matrix.id }}
          path: matrices-frontier/artifacts-wave2/${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    if: always()
    needs: [pin, lane]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: matrices-wave2-v2-*
          path: lanes

      - name: Rank architecture ablations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, math
          rows=[]
          for meta in sorted(Path('lanes').rglob('meta.tsv')):
              d={}
              for line in meta.read_text(errors='replace').splitlines():
                  if '\t' in line:
                      k,v=line.split('\t',1); d[k]=v
              d['meta_path']=str(meta); rows.append(d)
          control=next((r for r in rows if r.get('hypothesis')=='W2-00-control' and r.get('status')=='ok'),None)
          base=float(control['score']) if control else math.nan
          def val(r):
              try: return float(r.get('score','nan'))
              except ValueError: return math.nan
          ok=[r for r in rows if r.get('status')=='ok' and math.isfinite(val(r))]
          ok.sort(key=val)
          with open('ranking.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t')
              w.writerow(['rank','hypothesis','persona','patch_id','score','delta_vs_control','fill','frontier_sha'])
              for i,r in enumerate(ok,1):
                  s=val(r); d=s-base if math.isfinite(base) else math.nan
                  w.writerow([i,r.get('hypothesis'),r.get('persona'),r.get('patch_id'),f'{s:.9f}',f'{d:+.9f}' if math.isfinite(d) else '',r.get('fill'),r.get('frontier_sha')])
          with open('failures.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t'); w.writerow(['hypothesis','persona','patch_id','phase','status','frontier_sha','meta_path'])
              for r in rows:
                  if r.get('status')!='ok':
                      w.writerow([r.get('hypothesis'),r.get('persona'),r.get('patch_id'),r.get('phase'),r.get('status'),r.get('frontier_sha'),r.get('meta_path')])
          print(Path('ranking.tsv').read_text())
          print(Path('failures.tsv').read_text())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: matrices-wave2-v2-ranking-${{ github.run_id }}
          path: |
            ranking.tsv
            failures.tsv
          retention-days: 14
