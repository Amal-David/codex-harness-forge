name: Yukon matrices secure finalist submit

on:
  push:
    branches:
      - yukon-matrices-fast-20260829
    paths:
      - 'yukon-matrices/apply-and-submit.sh'
      - '.github/workflows/yukon-matrices-secure-submit.yml'

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: yukon-matrices-secure-finalist-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Secure login, exact Yukon clone, setup, and untouched baseline
        run: bash yukon-matrices/secure-baseline.sh
      - name: Compose, rerun, test, and submit finalist
        run: bash yukon-matrices/apply-and-submit.sh
      - name: Upload complete submission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yukon-matrices-secure-submit-${{ github.run_id }}
          path: |
            yukon-matrices/artifacts/secure-baseline
            yukon-matrices/artifacts/secure-submit
          if-no-files-found: warn
          retention-days: 7
